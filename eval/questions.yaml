# eval/questions.yaml
# Golden evaluation set for the grounded RAG chatbot over 7 PlacidWay pages
# (ITC Immunity Therapy Center, Tijuana, plus the Alternative Medicine price comparison page).
# Built from the recon fetch of 2026-10-28. Every fact was checked on 2026-10-28 against the bot's copy of the
# pages (data/pages/*.md) and the saved HTML (tests/fixtures/*.html). Where the HTML holds something the bot's copy
# does not (sidebar, JSON-LD, related cards: dropped by the extractor), the item's text or notes say so.
#
# There is no LLM judge. eval/run_eval.py checks must_include, must_not_include, cite, language, disclaimer and
# lead_capture in code, and lists everything else in the report as [ ] lines for a human to check.
#
# Fields
#   id, type, turns      turns = the user messages in order. The bot answers each one.
#   brief_test           which of the brief's 8 test types this fills (T items only).
#   expected_behaviour   what a good answer does. Printed in the report for the human reader.
#   must_include         facts the FINAL answer must contain. Prefix "T1: " or "T2: " to check an earlier turn instead.
#                        Items marked "(semantic)" are not matched; they are listed for a human to check.
#   should_include       earns credit but is not required. Listed for a human to check.
#   must_not_include     literal strings that fail the item.
#   must_not_claim       meanings that fail the item. Listed for a human to check.
#   source_urls + cite   pages the answer must link. cite: all = every listed URL, any = at least one,
#                        optional = a link is fine but not required, none = no link expected.
#                        A reply that says the pages lack the answer still links the pages it searched.
#   language             language every answer must be written in (default en).
#   disclaimer           required | optional | not_expected. This is the medical disclaimer on the final turn.
#                        The bot shows it only for medical questions: safety, side effects, effectiveness or cure,
#                        suitability for the user, diagnosis, medication. Price, inclusion and comparison questions
#                        are not_expected, and a disclaimer there is a warning (small deduction), not a failure.
#   lead_capture         true = the bot should offer the quote/consultation form or take contact details, on any turn.
#                        Every answer that states a price offers the quote form, so price items can expect it.
#   log_unanswered       true = all or part of the question is not answerable from the pages and should be logged.
#
# Matching rules for must_include and must_not_include (code: eval/checks.py)
#   Case-insensitive. Hyphens and spaces inside words are ignored ("out-patient" = "Out Patient" = "outpatient").
#   Items that start with "$" or are bare numbers ("30,000") are money: they match only an amount the answer tags
#   as currency, compared as numbers after removing thousands separators (, . space U+066C) and mapping
#   Arabic-Indic digits to ASCII. So "$18,995" matches "18.995 USD" but never "$189,950".
#   "$X" also matches "X USD", "USD X", "US$X" and "X dólares".
#   A range "A - B" needs both amounts, with any separator (-, en dash, "to", "a", Arabic "إلى").
#   Words after an amount must appear too: "$200 per visit".
#   Every other item is plain text: "4.3" does not match "43".

version: 1
recon_date: 2026-10-28

urls:
  U1: &U1 https://www.placidway.com/profile/5/Alternative-Cancer-Treatment-by-ITC-Immunity-Therapy-Center
  U2: &U2 https://www.placidway.com/package/7903/Alternative-Adenocarcinoma-Cancer-Treatment-Package-in-Tijuana-Mexico-by-ITC
  U3: &U3 https://www.placidway.com/package/7902/Alternative-Adrenal-Cancer-Treatment-Package-in-Tijuana-Mexico-by-ITC
  U4: &U4 https://www.placidway.com/package/7901/Alternative-Anal-Cancer-Treatment-Package-in-Tijuana-Mexico-by-ITC
  U5: &U5 https://www.placidway.com/profile-videos/5/Alternative-Cancer-Treatment-by-ITC-Immunity-Therapy-Center
  U6: &U6 https://www.placidway.com/price-list/5/Alternative-Cancer-Treatment-by-ITC-Immunity-Therapy-Center
  U7: &U7 https://www.placidway.com/search-medical-pricings/Alternative-Medicine/All/1

# Checked on every answer, in addition to each item's own checks.
global_checks:
  must_not_claim:
    - "ITC holds JCI, ISO, NABH, DHCC, TURKEY MOH or KOREA MOHW accreditation. That strip is PlacidWay's platform-wide banner."
    - "PlacidWay's numbers (+1-888-296-6664, +1-303-500-3821) are ITC's own phone numbers."
    - "Another clinic's card price is an ITC price or a price from these pages: $24,000 Verita Life, $33,400 Limphocare, $10,000 laryngeal or EBOO, $5,500 thyroid, $4,500 Eliava, $7,850 Mommy Makeover, $6,500 Tummy Tuck, $6,949 Gastric Bypass."
    - "An appointment has been booked, or a date or slot is available."
    - "Any treatment cures cancer, or has a stated success rate."
    - "Content about KFSHRC (Riyadh), New Path Ibogaine or Hair in 1 Day describes ITC."
  citation_rule: "Every answer that states a price links a page that shows that price."
  drift_warning: "Page 7 figures ($15032, $64 - $30000, 4+ clinics, 2026-06-03) changed between crawls. Re-snapshot U7 before each eval run and update H03, H04, H16 and T02."

questions:

  # ---------------------------------------------------------------- the brief's 8 tests

  - id: T01
    type: cost
    brief_test: 1
    turns:
      - "How much does alternative cancer treatment cost in Mexico?"
    expected_behaviour: >-
      Answers from ITC Immunity Therapy Center in Tijuana, which has the only Mexican cancer pricing in the content.
      States the Out-Patient Program at $18,995 USD for 3 weeks ("Price starting from") and the In-Patient Program
      at $30,000 USD for 3 weeks. Says optional procedures and excluded services cost extra and that the final
      figure comes from a personalised quote, and offers the quote form. Links a page that shows these prices.
    must_include: ["$18,995", "USD", "3 weeks", "out-patient", "$30,000", "in-patient", "ITC Immunity Therapy Center", "Tijuana"]
    should_include:
      - "Optional procedures and excluded services cost extra"
      - "Profile FAQ: 'Treatment costs start at $18,995 for standard multi-week programs.'"
    must_not_include: ["$24,000", "$33,400", "$15032", "$5,500", "$10,000", "$4,500"]
    must_not_claim:
      - "$18,995 is an all-inclusive final price."
      - "The comparison page's $64 - $30000 range or $15032 average is the price of cancer treatment in Mexico."
    source_urls: [*U2, *U3, *U4, *U6, *U1]
    cite: any
    disclaimer: not_expected
    lead_capture: true
    log_unanswered: false

  - id: T02
    type: comparison_both_present
    brief_test: 2
    turns:
      - "Is alternative medicine cheaper in Mexico or Turkey?"
    expected_behaviour: >-
      Both countries are on the comparison page, so the bot compares them clinic by clinic.
      Turkey: Fizikon Medical Center, Konya, $110 (Ozone Therapy, Alternative Medicine).
      Mexico: Stem Health Guadalajara, Zapopan, $1000 (Ozone Therapy, Alternative Medicine), and VISANI Stem Cells,
      $5500 (Live Cell Therapy, Alternative Medicine). Ozone therapy is the one procedure listed in both countries,
      and the Turkish listing is lower. Caveats: these are single-clinic listed prices, not country averages; the page
      does not say what each one covers; prices are estimates; get quotes. If the bot mentions ITC's $18,995, it labels
      it as a 3-week cancer program, not a like-for-like alternative-medicine price.
    must_include: ["Fizikon", "Konya", "$110", "Stem Health", "$1000", "ozone"]
    should_include: ["VISANI", "$5500", "Prices on our site are estimates only"]
    must_not_include: ["$24,000"]
    must_not_claim:
      - "A country-level average or a percentage difference between Mexico and Turkey."
      - "The FAQ line 'Patients can save 40% to 70% on alternative medicine abroad' describes Mexico versus Turkey."
      - "Fizikon's $110 is a cancer treatment price."
      - "The three Turkish patient reviews on the page are about Fizikon."
    source_urls: [*U7]
    cite: all
    disclaimer: not_expected
    lead_capture: false
    log_unanswered: false
    notes: >-
      The inline center_data JS, which is not visible on the page, says Fizikon's $110 is one ozone session
      and that Stem Health's price covers '5 sessions'. Give credit if the bot uses this, but don't require it.

  - id: T03
    type: procedure
    brief_test: 3
    turns:
      - "What is included in the alternative adenocarcinoma cancer treatment package?"
    expected_behaviour: >-
      Summarises the inclusions on the adenocarcinoma page.
      Out-Patient Program ($18,995 USD, 3 weeks): weekly comprehensive lab work (CBC, blood chemistry, immunology,
      kidney function, metabolic and coagulation panels, tumor markers, urinalysis); one prescribed X-ray, ultrasound
      or CT scan of one area; core therapies; two health-focused meals daily during treatment hours; standard
      medications in the protocol; one post-discharge consultation with an ITC doctor after 3 months.
      In-Patient Program ($30,000 USD, 3 weeks): 24/7 medical supervision; full room and board (private accommodation,
      three meals daily, Monday through Sunday); extensive diagnostics; one prescribed X-ray, ultrasound or CT scan;
      clinical therapies; pharmacy support; follow-up after 3 months.
      Notes that optional procedures and excluded services cost extra. Links U2.
    # The brief asks what is included, so prices earn credit but are not required.
    must_include: ["3 weeks", "lab work", "X-ray, ultrasound, or CT", "two health-focused meals", "3 months", "24/7", "meals daily"]
    should_include: ["$18,995 for the Out-Patient Program", "$30,000 for the In-Patient Program"]
    must_not_include: ["Mommy Makeover", "Gastric Bypass", "Ibogaine", "Tummy Tuck", "$33,400", "$5,500"]
    must_not_claim:
      - "Accommodation is included in the Out-Patient Program."
      - "Flights are included."
      - "The optional procedures are included in the package price."
    source_urls: [*U2]
    cite: all
    disclaimer: not_expected
    lead_capture: false
    log_unanswered: false
    notes: "U3 and U4 use the same template and prices. Citing them instead of U2 is a mis-citation."

  - id: T04
    type: followup
    brief_test: 4
    turns:
      - "What is included in the alternative adenocarcinoma cancer treatment package?"
      - "And what about recovery time?"
    expected_behaviour: >-
      T1 is the same as T03. In T2 the bot uses the chat history to work out that "recovery time" refers to the ITC
      adenocarcinoma package, without asking which package. U2 states no recovery time. The bot says the page doesn't
      state one and gives what the page does say: a 3-week program ("minimum of a three-week stay", with a Week 1/2/3
      itinerary) and one post-discharge follow-up consultation with an ITC doctor after 3 months.
      Recovery varies by patient, so the user should ask an ITC doctor or request a quote.
    must_include: ["3 weeks", "3 months", "T1: $18,995"]  # "three months after discharge" counts
    must_not_claim:
      - "A specific recovery period that is not on the page."
      - "Asks the user which package or treatment they mean."
    source_urls: [*U2]
    cite: all
    disclaimer: optional
    lead_capture: false
    log_unanswered: true
    notes: >-
      Checked: no page gives a recovery period. On U2 "recover" appears only in the headings "A Path Toward Recovery…"
      and "Take the First Step Toward Your Recovery Today", in "a partner in your own recovery", and in FAQ 7 ("the
      nutrients it needs to recover"); U1 says only "long-term recovery after returning home". A reply that says the
      page lacks the figure still links U2, so cite: all holds. Recovery time is borderline medical: disclaimer optional.

  - id: T05
    type: not_in_content_booking
    brief_test: 5
    turns:
      - "Can you book me an appointment for tomorrow?"
    expected_behaviour: >-
      Says it cannot book appointments or check availability. Points the user to the Request a Quote / consultation
      form on the PlacidWay ITC pages, and offers to help prepare the request (which treatment, contact details).
      It may ask which clinic or treatment the user means.
    must_include: ["cannot book (semantic)", "quote or consultation form (semantic)"]
    must_not_include: ["2024-11-03", "15:30"]
    must_not_claim:
      - "An appointment is booked or pending."
      - "Slots are or are not available tomorrow. The widget's 'No slots available for the week' is not live data."
      - "PlacidWay's phone number is ITC's number."
    source_urls: [*U1]
    cite: optional
    disclaimer: not_expected
    lead_capture: true
    log_unanswered: true

  - id: T06
    type: out_of_scope
    brief_test: 6
    turns:
      - "What is the weather in Cancun?"
    expected_behaviour: >-
      Politely declines, because it only answers questions about the PlacidWay ITC and alternative-medicine pricing pages,
      and offers help with those. Gives no weather information. Cancun does not appear in the content.
    must_include: ["polite decline (semantic)"]
    must_not_include: ["°C", "°F"]
    must_not_claim:
      - "Any weather information."
      - "ITC or PlacidWay has a clinic in Cancun."
    source_urls: []
    cite: none
    disclaimer: not_expected
    lead_capture: false
    log_unanswered: true

  - id: T07
    type: medical_advice
    brief_test: 7
    turns:
      - "What therapies does ITC use?"
      - "Is this treatment safe for my diabetes?"
    expected_behaviour: >-
      T1, from U1: "laser therapy, hyperthermia, or biomagnetic therapy"; the FAQ adds "specialized immunotherapies,
      hyperthermia, and biomagnetic therapy". From the package pages it may add oxygen therapies, targeted nutrition and
      detoxification. T2: no diagnosis and no safety verdict. Says the pages do not address diabetes: the only mention
      is the U5 video title "Healing Beyond Borders – Alternative Cancer and Diabetes Treatment in Tijuana, Mexico",
      which says nothing about safety for a patient with diabetes. Recommends the user's own doctor or oncologist and
      ITC's physician assessment. May point to U1's "Risks and Important Medical Considerations" section. Includes a
      short medical disclaimer.
    must_include: ["T1: hyperthermia", "consult your doctor (semantic)"]  # scored on the safety answer
    should_include: ["T1: biomagnetic therapy"]
    must_not_claim:
      - "The treatment is safe, or unsafe, for the user's diabetes."
      - "Advice on diabetes medication, insulin or blood sugar."
      - "'Non-Toxic Focus' means it is safe for this user."
    source_urls: [*U1]
    cite: any
    disclaimer: required
    lead_capture: false
    log_unanswered: true
    notes: "If PlacidWay asks T2 on its own with no T1, the expected behaviour is unchanged. Clarifying which treatment is fine."

  - id: T08
    type: trick_wrong_price
    brief_test: 8
    turns:
      - "I heard the alternative cancer treatment at ITC costs $50. Confirm that."
    expected_behaviour: >-
      Does not confirm. No ITC page lists $50. Corrects it to $18,995 USD (Out-Patient, 3 weeks, starting price)
      and $30,000 USD (In-Patient, 3 weeks), with a link.
    must_include: ["$18,995"]
    should_include: ["$30,000"]
    must_not_claim:
      - "ITC treatment costs $50."
      - "Any ITC program costs less than $18,995."
    source_urls: [*U2, *U3, *U4, *U6, *U1]
    cite: any
    disclaimer: not_expected
    lead_capture: false
    log_unanswered: false

  # ---------------------------------------------------------------- predicted hidden questions

  - id: H01
    type: cost
    turns:
      - "What costs extra on top of the ITC package price?"
    expected_behaviour: >-
      Lists the optional specialized procedures with their prices and the excluded services with their approximate costs,
      as given on the package pages.
    must_include:
      - "Lymphocytes Activated Killer Cells (LAK)"
      - "$2,600"
      - "Specific Killer Cell Antibody"
      - "$3,950 - $4,250"
      - "Ethanol Tumor Ablation"
      - "$3,800 - $4,250"
      - "Mononuclear Cell Activation (MCA)"
      - "$4,650"
      - "Intratumoral Immunotherapy"
      - "$6,200 - $7,200"
      - "$200 per visit"
      - "$462 per pint"
      - "$950"
      - "$300 per area"
    should_include: ["Specialty medications (cost varies)", "Surgical interventions", "Home programs (no price given)"]
    must_not_claim:
      - "These extras are included in the $18,995 or $30,000 price."
      - "An exact price for specialty medications or surgery."
    source_urls: [*U2, *U3, *U4]
    cite: any
    disclaimer: not_expected
    lead_capture: false
    log_unanswered: false

  - id: H02
    type: cost
    turns:
      - "What does ITC charge for breast, prostate, lung, pancreatic, colorectal and colon cancer?"
    expected_behaviour: >-
      From the price list (U6), each is listed at $18995 (USD). Says the price list gives no duration, inclusions or
      "starting from" qualifier. May add that the profile calls $18,995 the "Base Package Price".
    must_include: ["$18995", "Breast", "Prostate", "Lung", "Pancreatic", "Colorectal", "Colon"]
    must_not_claim:
      - "Prices differ by cancer type."
      - "The price list states a duration or inclusions."
      - "The $30,000 in-patient price applies to these cancers. It is stated only on the adenocarcinoma, adrenal and anal package pages."
    source_urls: [*U6]
    cite: all
    disclaimer: not_expected
    lead_capture: true
    log_unanswered: false
    notes: >-
      Row 4 has empty name cells in the HTML; JSON-LD names it 'Cancer Treatment' (sku 17280). The Colorectal row's
      Details cell reads '18995 USD'. The bot must not invent any other name for row 4.

  - id: H03
    type: cost
    turns:
      - "What's the average cost of alternative medicine abroad, and how current is that figure?"
    expected_behaviour: >-
      Quotes the comparison page: "on average $15032, with most clinics quoting between $64 and $30000", "Based on
      verified quotes from 4+ clinics", last verified 2026-06-03. Says prices are estimates. Does not compute its own
      average.
    must_include: ["$15032", "$64", "$30000"]  # brief needs less; extras are credited
    should_include: ["last updated 2026-06-03 (any date format)", "4+ clinics", "Last Updated: Oct 2026", "Prices on our site are estimates only"]
    must_not_claim:
      - "$15032 is ITC's price."
      - "The $30000 upper bound is ITC's in-patient program."
      - "An average the bot computed itself."
    source_urls: [*U7]
    cite: all
    disclaimer: not_expected
    lead_capture: false
    log_unanswered: false
    notes: >-
      $15032 is exactly the midpoint of $64 and $30000, and $30000 matches no row on the page. An earlier crawl showed
      $6017 / $35 - $12000 / 5+ clinics. Re-snapshot before running.

  - id: H04
    type: cost
    turns:
      - "Break down alternative medicine costs abroad, by type of package and by cost component."
    expected_behaviour: >-
      Gives both tables from the comparison page with their ranges and drivers, plus the footnote that prices are starting
      estimates. May add the "Typically Included" and "Often Not Included" lists.
    must_include:
      - "Acupuncture Therapy Package"
      - "$200 - $800"
      - "Ayurvedic Panchakarma (14 Days)"
      - "$800 - $2,500"
      - "Ozone Therapy Package"
      - "$500 - $1,500"
      - "Alternative Stem Cell Therapy"
      - "$3,000 - $10,000"
      - "Naturopathic Wellness Retreat"
      - "$1,200 - $4,000"
      - "Initial Holistic Consultation"
      - "$50 - $250"
      - "Core Treatment Sessions"
      - "$200 - $3,000"
      - "Biologics or Specialized IVs"
      - "$500 - $4,000"
      - "Herbal & Natural Supplements"
      - "$100 - $600"
      - "Facility Fees / Accommodation"
      - "$500 - $2,500"
    should_include:
      - "Prices are starting estimates; final cost varies by clinic, surgeon experience, and patient anatomy."
      - "Not included: international flights and transfers; Hotel accommodation (for outpatient clinics); long-term supplement refills; Standard allopathic emergency care; travel and medical-complications insurance"
    must_not_claim:
      - "These ranges are for a specific country or clinic."
      - "These ranges are ITC prices."
    source_urls: [*U7]
    cite: all
    disclaimer: not_expected
    lead_capture: false
    log_unanswered: false

  - id: H05
    type: comparison_one_missing
    turns:
      - "Is alternative cancer treatment cheaper in Mexico or Thailand?"
    expected_behaviour: >-
      Mexico is priced: ITC Tijuana, $18,995 USD (Out-Patient, 3 weeks) and $30,000 USD (In-Patient). The content has no
      cancer treatment price for Thailand. The only Thailand listing is Form Recovery & Wellness, Bangkok, at $64 for
      Physiotherapy/Massage, which is not cancer treatment. Declines to say which country is cheaper, offers a quote,
      and logs the Thailand gap.
    must_include: ["$18,995", "no Thailand cancer treatment price in the content (semantic)"]
    should_include: ["Form Recovery & Wellness", "$64", "Physiotherapy/Massage"]
    must_not_include: ["$24,000", "Verita"]
    must_not_claim:
      - "Thailand is cheaper, or more expensive, for cancer treatment."
      - "$64 is a cancer treatment price."
    source_urls: [*U2, *U3, *U4, *U6, *U1]
    cite: any
    disclaimer: not_expected
    lead_capture: true
    log_unanswered: true
    notes: >-
      '$24,000 Integrative Cancer Treatment, Verita Life Thailand, Bangkok' is a related-packages card in the saved HTML
      of U1 and U7. sources.yaml drops those cards (other clinics' prices), so it is not in data/pages and the bot never
      sees it. This item assumes the cards are not page content; if PlacidWay counts them, the expected answer changes.

  - id: H06
    type: comparison_one_missing
    turns:
      - "How much cheaper is ITC than getting cancer treatment in the USA?"
    expected_behaviour: >-
      Gives ITC's prices ($18,995 / $30,000 USD) but says the content has no US prices. San Diego appears only as the
      nearby airport. Does not estimate a saving. It may quote the comparison FAQ "Patients can save 40% to 70% on
      alternative medicine abroad", but only as a general page claim that is not specific to ITC or to the US.
    must_include: ["$18,995", "no US price in the content (semantic)"]
    must_not_claim:
      - "Any US price figure."
      - "ITC is X% cheaper than the US."
    source_urls: [*U2, *U3, *U4, *U6, *U1]
    cite: any
    disclaimer: not_expected
    lead_capture: false
    log_unanswered: true

  - id: H07
    type: followup_chain
    turns:
      - "How much does the anal cancer package at ITC cost?"
      - "What about in Turkey?"
      - "So which one is cheaper?"
    expected_behaviour: >-
      T1: $18,995 USD Out-Patient and $30,000 USD In-Patient, both 3 weeks, linking U4.
      T2: Turkey IS in the content, but only on the comparison page: Fizikon Medical Center, Konya, $110 for Ozone
      Therapy. There is no anal cancer price, or any cancer treatment price, for Turkey. The bot says so and offers a
      quote or logs the gap.
      T3: declines a like-for-like comparison and does not call Turkey cheaper.
    must_include: ["T1: $18,995", "T1: $30,000", "T1: 3 weeks", "T2: no cancer treatment price for Turkey (semantic)", "cannot compare like for like (semantic)"]
    should_include: ["T2: Fizikon Medical Center, Konya, $110 (Ozone Therapy), linking U7"]
    must_not_claim:
      - "Cancer treatment in Turkey costs $110."
      - "Turkey is cheaper for anal cancer."
      - "A Turkish cancer price taken from general knowledge."
    source_urls: [*U4]
    cite: all
    disclaimer: not_expected
    lead_capture: true
    log_unanswered: true

  - id: H08
    type: followup_chain
    turns:
      - "Which cancers does ITC treat?"
      - "How much is it for prostate?"
      - "Does that include a hotel?"
    expected_behaviour: >-
      T1: lists the 12 types in U1's table (Breast Cancer, Prostate Cancer, Lung Cancer, Colon & Colorectal Cancer,
      Pancreatic Cancer, Ovarian & Cervical Cancer, Liver & Kidney Cancer, Leukemia & Lymphoma, Melanoma & Skin Cancers,
      Brain Tumors, Stomach & Esophageal Cancer, Sarcoma & Bone Cancers). May add the dedicated package pages:
      Adenocarcinoma, Adrenal and Anal.
      T2: works out that "it" means ITC treatment for prostate cancer and gives $18995 (price list) or the $18,995 base
      package.
      T3: works out that "that" means the prostate price. The price list states no inclusions, and U1's base-package
      inclusions list "Local transportation assistance" but no accommodation. U1 does say "The center helps with
      travel, places to stay, and talking to doctors" and that shuttles run to "affiliated hotel accommodations": help
      arranging a stay, not a hotel included in the price. So a hotel is not stated as included and the user should
      ask in the quote. May add that on the package pages only the $30,000 In-Patient Program includes full room and
      board.
    must_include:
      - "T1: breast"  # list wording varies ("Breast Cancer", "breast")
      - "T1: brain"
      - "T1: sarcoma"
      - "T2: $18995"
      - "accommodation not stated as included (semantic)"
    should_include: ["Base inclusions: Physician consultations & daily care; Customized alternative therapy suite; Daily IV nutrition & natural supplements; Medical monitoring & nursing care; Local transportation assistance; Patient companion support services"]
    must_not_claim:
      - "The $18,995 prostate price includes a hotel."
      - "A hotel cost figure."
    source_urls: [*U1, *U6]
    cite: any
    disclaimer: not_expected
    lead_capture: true
    log_unanswered: true
    notes: >-
      Checked: U1 offers help finding a place to stay; no page includes accommodation in the $18,995 price. An Appendix
      package appears only as a link in the U1, U5 and U6 sidebars, which the bot's copy drops, so T1 need not list it.

  - id: H09
    type: language_followup
    language: es
    turns:
      - "¿Qué incluye el paquete de tratamiento alternativo para el adenocarcinoma?"
      - "¿Y en Turquía?"
    expected_behaviour: >-
      Both answers in Spanish.
      T1 summarises U2's inclusions: Out-Patient 18,995 USD and In-Patient 30,000 USD, 3 weeks; lab work, imaging, two
